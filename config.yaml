# ADWS Testing Configuration

database:
  url: "sqlite:///test_runs.db"

standard_configuration:
  path: "~/ai/standard-configuration"

claude:
  command: "claude"
  models:
    sonnet: "sonnet"
    haiku: "haiku"
  default_model: "sonnet"
  default_args:
    - "--output-format"
    - "stream-json"
    - "--verbose"
    - "-p"
    - "--dangerously-skip-permissions"

# LLM judge configuration (separate from test execution)
openai:
  api_key: "${OPENAI_API_KEY}"
  judge_model: "gpt-4o-mini"

process:
  max_wait_time: 300  # seconds
  poll_interval: 1     # seconds

artifacts:
  base_path: "./runs"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# ADW (AI Developer Workflow) test execution configuration
adw:
  adw_directory: "dist/.adws"  # Path to ADWs in dist directory
  python_version: "3.13"       # Python version for uv run
  uv_command: "uv"              # Command to run uv
  adw_timeout: 600              # Max execution time for ADWs (seconds)